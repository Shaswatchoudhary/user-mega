apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
// default RN config
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
ndkVersion rootProject.ext.ndkVersion
buildToolsVersion rootProject.ext.buildToolsVersion
compileSdk rootProject.ext.compileSdkVersion

namespace "com.workies.app"

defaultConfig {
    applicationId "com.workies.app"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 5
    versionName "1.4"
    multiDexEnabled true
}

signingConfigs {
    debug {
        storeFile file('debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
}

buildTypes {
    debug {
        signingConfig signingConfigs.debug
    }
    release {
        signingConfig signingConfigs.debug
        minifyEnabled enableProguardInReleaseBuilds
        proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
    }
}

// ✅ Java + Kotlin compatibility
compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

kotlinOptions {
    jvmTarget = "17"
}

// ✅ CRITICAL FIX: ensure Kotlin + Java both included
sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/main/kotlin']
    }
}


}

dependencies {
// ❌ DO NOT manually include react-android (handled by RN plugin)


implementation("com.facebook.react:flipper-integration")

if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
} else {
    implementation jscFlavor
}


}

// React Native autolinking
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

// Firebase / Google services
apply plugin: "com.google.gms.google-services"

// Vector icons
project.ext.vectoricons = [
iconFontNames: [
'Ionicons.ttf','MaterialCommunityIcons.ttf','Feather.ttf','FontAwesome.ttf',
'AntDesign.ttf','Entypo.ttf','EvilIcons.ttf','FontAwesome5_Brands.ttf',
'FontAwesome5_Regular.ttf','FontAwesome5_Solid.ttf','Fontisto.ttf',
'Foundation.ttf','MaterialIcons.ttf','Octicons.ttf','SimpleLineIcons.ttf','Zocial.ttf'
]
]

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// Dependency conflict fixes
configurations.all {
resolutionStrategy {
force "androidx.core:core:1.12.0"
force "androidx.core:core-ktx:1.12.0"
force "androidx.transition:transition:1.4.1"
force "androidx.transition:transition-ktx:1.4.1"
force "com.google.guava:guava:32.1.2-android"
}
}
